name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt onnxruntime fastapi "uvicorn[standard]" python-multipart httpx

      - name: Generate test images (downloads MNIST once, 11 MB)
        run: python make_samples.py --out samples --seed 0

      - name: Run tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -m pytest tests -q
